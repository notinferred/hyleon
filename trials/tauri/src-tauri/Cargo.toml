[package]
name = "trial-tauri"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[dependencies]
# `tauri::generate_context!` expands to code that names serde_json.
serde_json.workspace = true
tauri = { version = "=2.12.4", features = [] }
tauri-plugin-process = "=2.4.0"
# Without "zip": Hyleon ships bare installers, so the zip extraction (and its advisories) isn't needed.
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }

[lints]
workspace = true
