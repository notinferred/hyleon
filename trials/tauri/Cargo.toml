# The Leptos + Tauri trial that D-043 chose (docs/steps/T-02.md), kept as the reference for Hyleon's
# app. Its own workspace and lockfile, outside Hyleon's, so the trial never reaches the gate.
[workspace]
resolver = "3"
members = ["src-tauri", "ui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
