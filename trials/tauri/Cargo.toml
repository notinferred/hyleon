# Variants T-native and T-wasm of the T-02 comparison (trials/Cargo.toml explains why this is a
# separate workspace). Shares the stand-in core with the Dioxus variant.
[workspace]
resolver = "3"
members = ["src-tauri", "ui"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
bench-core = { path = "../bench-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
