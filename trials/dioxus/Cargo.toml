[package]
name = "trial-dioxus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
bench-core.workspace = true
dioxus = { workspace = true, features = ["macro", "html", "signals", "hooks", "launch", "document"] }
serde_json.workspace = true

# dioxus-web 0.7.10 calls `window.location()` for `document` but only enables web-sys's `Location`
# with its dev tools, so the web build doesn't compile without this (a Dioxus bug, not ours).
[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { version = "=0.3.106", features = ["Location"] }

[features]
desktop = ["dioxus/desktop"]
web = ["dioxus/web"]

[lints]
workspace = true
