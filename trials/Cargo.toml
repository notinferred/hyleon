# The T-02 comparison (docs/STEPS.md): Dioxus against Leptos + Tauri at Hyleon's end-case scale.
# Its own workspace and lockfile, outside Hyleon's, so neither stack reaches the gate and the one Dan
# doesn't choose can be deleted whole. Pins match the main workspace where they overlap.
[workspace]
resolver = "3"
members = ["bench-core", "dioxus"]
# Tauri 2.12 needs wry 0.57 and Dioxus 0.7 needs wry 0.53, which pin different webkit2gtk versions,
# and Cargo allows one per lockfile. So the Tauri trial is its own workspace.
exclude = ["tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
bench-core = { path = "bench-core" }
dioxus = { version = "=0.7.10", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
