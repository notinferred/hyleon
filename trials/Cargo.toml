# The T-02 comparison (docs/steps/T-02.md): the stand-in core, and the Leptos + Tauri trial that D-043
# chose. Its own workspace and lockfile, outside Hyleon's, so the trial never reaches the gate.
[workspace]
resolver = "3"
members = ["bench-core"]
# The Tauri trial is its own workspace: during the comparison, Tauri's wry 0.57 and Dioxus's wry 0.53
# pinned different webkit2gtk versions, and Cargo allows one per lockfile.
exclude = ["tauri"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
bench-core = { path = "bench-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
