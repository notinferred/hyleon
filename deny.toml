# Supply-chain checks (docs/SECURITY.md, S-08), run in CI with `cargo deny --locked check`.

# Advisories use cargo-deny's defaults: vulnerable, unsound and unmaintained crates fail. Dan approved
# each ignore below (T-02); any other advisory still fails.
[advisories]
ignore = [
    # Unmaintained, with no newer version to move to.
    { id = "RUSTSEC-2024-0388", reason = "derivative: unmaintained; used inside Velopack" },
    { id = "RUSTSEC-2025-0057", reason = "fxhash: unmaintained; used inside wry, Dioxus's webview layer" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained; used inside image and rav1e, through Dioxus desktop" },
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained; used inside the GTK3 bindings for Linux" },
    # zip 8 through Velopack 1.2. All three are in zip's extract functions, which Velopack never calls: it
    # copies each entry to a path it chose. Remove these when Velopack 1.3 (zip 9) is stable and two weeks old.
    { id = "RUSTSEC-2026-0367", reason = "zip extract keeps SUID/SGID bits; Velopack doesn't call extract" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract follows symlinks out of the target; Velopack doesn't call extract" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract sets permissions through symlinks; Velopack doesn't call extract" },
]

[graph]
# The app's desktop and web dependencies sit behind features, so every feature is checked.
all-features = true

[licenses]
# D-016, D-040 and D-041. A dependency that needs a licence not listed here goes to Dan; it isn't added silently.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "EPL-2.0",
    "CDLA-Permissive-2.0",
    "NCSA",
    "Apache-2.0 WITH LLVM-exception",
]

[licenses.private]
# Hyleon's own crates are proprietary and never published (LICENSE).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Hyleon never calls a language model; people bring their own agent (docs/ARCHITECTURE.md, No AI SDKs).
deny = [
    { crate = "anthropic", reason = "no language-model SDKs" },
    { crate = "anthropic-sdk", reason = "no language-model SDKs" },
    { crate = "async-openai", reason = "no language-model SDKs" },
    { crate = "clust", reason = "no language-model SDKs" },
    { crate = "gemini-rs", reason = "no language-model SDKs" },
    { crate = "genai", reason = "no language-model SDKs" },
    { crate = "google-generative-ai-rs", reason = "no language-model SDKs" },
    { crate = "langchain-rust", reason = "no language-model SDKs" },
    { crate = "llm", reason = "no language-model SDKs" },
    { crate = "misanthropic", reason = "no language-model SDKs" },
    { crate = "mistralai-client", reason = "no language-model SDKs" },
    { crate = "ollama-rs", reason = "no language-model SDKs" },
    { crate = "openai", reason = "no language-model SDKs" },
    { crate = "openai-api-rs", reason = "no language-model SDKs" },
    { crate = "rig-core", reason = "no language-model SDKs" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
