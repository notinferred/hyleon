name: Trials

# Started by hand. The Leptos + Tauri trial that D-043 chose (docs/steps/T-02.md), kept as the
# reference for Hyleon's app: its checks, a render check on the web, and its signed update from
# 0.0.1 to 0.0.2 on macOS and Windows. The comparison's measuring tools are in git history.
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which jobs to run, so a rerun spends only the minutes it needs
        type: choice
        options: [all, check, web, macos, windows]
        default: all

permissions:
  contents: read

concurrency:
  group: trials-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TRUNK_RELEASE: https://github.com/trunk-rs/trunk/releases/download/v0.21.14
  TAURI_CLI_RELEASE: https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v2.12.3

defaults:
  run:
    shell: bash
    working-directory: trials/tauri

jobs:
  check:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'check' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Kept even when a later step fails, so the next run doesn't rebuild everything.
          cache-on-failure: true
          workspaces: trials/tauri -> target
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny@0.20.2
      - name: Format
        run: cargo fmt --all --check
      - name: Licences, advisories, bans and sources (Hyleon's policy)
        if: ${{ !cancelled() }}
        run: cp ../../deny.toml deny.toml && cargo deny --locked check
      - name: Tests
        if: ${{ !cancelled() }}
        run: cargo test --locked -p trial-leptos
      - name: Lints, web build
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p trial-leptos --target wasm32-unknown-unknown -- -D warnings

  web:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'web' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: trials/tauri -> target
      - name: Install Trunk
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trunk.tar.gz" "$TRUNK_RELEASE/trunk-x86_64-unknown-linux-gnu.tar.gz"
          echo "f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b  $RUNNER_TEMP/trunk.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Build the UI for the web
        run: cd ui && trunk build --release
      - name: Renders in a browser
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory ui/dist > /dev/null 2>&1 &
          sleep 1
          chrome=$(command -v google-chrome || command -v chromium)
          "$chrome" --headless=new --disable-gpu --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8080/ > page.html
          for text in "Sheet E-101" "Findings (4)" "Pump P-101 and its drive"; do
            grep -qF "$text" page.html || { echo "missing: $text"; exit 1; }
          done
          echo "the web build rendered"

  macos:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: trials/tauri -> target
      - name: Install Trunk and the Tauri CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trunk.tar.gz" "$TRUNK_RELEASE/trunk-aarch64-apple-darwin.tar.gz"
          echo "764e299dd50d89442a4e96a236349f57961984b701e74d3dbdb39cd1c9f5101e  $RUNNER_TEMP/trunk.tar.gz" | shasum -a 256 -c -
          curl -fsSL -o "$RUNNER_TEMP/tauri.zip" "$TAURI_CLI_RELEASE/cargo-tauri-aarch64-apple-darwin.zip"
          echo "35e3b339bfb5f2061023bf5646dc969e5fa53b6fc4347daf467e7f6743692494  $RUNNER_TEMP/tauri.zip" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/trunk.tar.gz" -C "$RUNNER_TEMP/bin"
          unzip -q "$RUNNER_TEMP/tauri.zip" -d "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Built twice (0.0.1 and 0.0.2) with a throwaway signing key
        run: |
          (cd ui && trunk build --release)
          (cd src-tauri && cargo-tauri icon ../app-icon.png > /dev/null)
          cargo clippy --locked -p trial-tauri -- -D warnings
          cargo-tauri signer generate --ci -w "$RUNNER_TEMP/trial.key" -p "" > /dev/null
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/trial.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          for v in 0.0.1 0.0.2; do
            jq -n --arg v "$v" --arg k "$(cat "$RUNNER_TEMP/trial.key.pub")" '{version: $v, plugins: {updater: {pubkey: $k}}}' > "$RUNNER_TEMP/conf.json"
            (cd src-tauri && cargo-tauri build --bundles app --config "$RUNNER_TEMP/conf.json")
            mkdir -p "$RUNNER_TEMP/$v"
            cp -R target/release/bundle/macos/. "$RUNNER_TEMP/$v/"
          done
          ls -la "$RUNNER_TEMP/0.0.1" "$RUNNER_TEMP/0.0.2"

      - name: Signed update, 0.0.1 to 0.0.2
        run: |
          feed="$RUNNER_TEMP/feed" && mkdir -p "$feed"
          cp "$(find "$RUNNER_TEMP/0.0.2" -name '*.app.tar.gz' | head -n 1)" "$feed/app.tar.gz"
          sig=$(cat "$(find "$RUNNER_TEMP/0.0.2" -name '*.app.tar.gz.sig' | head -n 1)")
          jq -n --arg s "$sig" '{version: "0.0.2", notes: "trial", pub_date: "2026-10-30T00:00:00Z", platforms: {"darwin-aarch64": {signature: $s, url: "http://127.0.0.1:8765/app.tar.gz"}}}' > "$feed/latest.json"
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$feed" > /dev/null 2>&1 &
          for _ in $(seq 20); do curl -fs -o /dev/null http://127.0.0.1:8765/latest.json && break; sleep 0.5; done
          app=$(find "$RUNNER_TEMP/0.0.1" -maxdepth 1 -name '*.app' | head -n 1)
          try="$RUNNER_TEMP/try" && mkdir -p "$try" && cp -R "$app" "$try/"
          exe=$(find "$try/$(basename "$app")/Contents/MacOS" -type f -perm -u+x | head -n 1)
          marker="$RUNNER_TEMP/self-test.txt"
          "$exe" --self-test "$marker" --update-feed http://127.0.0.1:8765/latest.json --log "$RUNNER_TEMP/t-update.log" &
          for _ in $(seq 120); do grep -q 'up to date' "$marker" 2>/dev/null && break; sleep 2; done
          echo "--- app log"; cat "$RUNNER_TEMP/t-update.log" 2>/dev/null || echo "(none)"
          echo "--- self-test"; cat "$marker" 2>/dev/null || echo "(none)"
          sed -n 1p "$marker" | grep -Eq '^0\.0\.1 rendered in [0-9]+ ms$'
          sed -n 2p "$marker" | grep -Eq '^0\.0\.2 rendered in [0-9]+ ms$'
          sed -n 3p "$marker" | grep -Eq '^Hyleon 0\.0\.2 is up to date\.$'
          echo "Ran 0.0.1, installed the signed 0.0.2 and relaunched."

  windows:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          workspaces: trials/tauri -> target
      - name: Install Trunk and the Tauri CLI
        run: |
          curl -fsSL -o "$RUNNER_TEMP/trunk.zip" "$TRUNK_RELEASE/trunk-x86_64-pc-windows-msvc.zip"
          echo "cd6ac15b9daff0365e5695036791ef2ce3c63f61c014f5a8c532363266e4569c  $RUNNER_TEMP/trunk.zip" | sha256sum -c -
          curl -fsSL -o "$RUNNER_TEMP/tauri.zip" "$TAURI_CLI_RELEASE/cargo-tauri-x86_64-pc-windows-msvc.zip"
          echo "563cb2aef280c393688cebaff1a9fd4a2f6df4fdb9be2c665ff3c798a4ffe7c2  $RUNNER_TEMP/tauri.zip" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          for z in trunk tauri; do unzip -q -o "$RUNNER_TEMP/$z.zip" -d "$RUNNER_TEMP/bin"; done
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Built twice (0.0.1 and 0.0.2) with a throwaway signing key
        run: |
          (cd ui && trunk build --release)
          (cd src-tauri && cargo-tauri icon ../app-icon.png > /dev/null)
          cargo clippy --locked -p trial-tauri -- -D warnings
          cargo-tauri signer generate --ci -w "$RUNNER_TEMP/trial.key" -p "" > /dev/null
          export TAURI_SIGNING_PRIVATE_KEY="$(cat "$RUNNER_TEMP/trial.key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=""
          for v in 0.0.1 0.0.2; do
            jq -n --arg v "$v" --arg k "$(cat "$RUNNER_TEMP/trial.key.pub")" '{version: $v, plugins: {updater: {pubkey: $k}}}' > "$RUNNER_TEMP/conf.json"
            (cd src-tauri && cargo-tauri build --bundles nsis --config "$RUNNER_TEMP/conf.json")
            mkdir -p "$RUNNER_TEMP/$v"
            cp -R target/release/bundle/nsis/. "$RUNNER_TEMP/$v/"
          done
          ls -la "$RUNNER_TEMP/0.0.1" "$RUNNER_TEMP/0.0.2"

      - name: Signed update, 0.0.1 to 0.0.2
        shell: pwsh
        run: |
          $feed = Join-Path $env:RUNNER_TEMP 'feed'
          New-Item -ItemType Directory -Force $feed | Out-Null
          # Both builds leave their installers in the bundle folder, so each is picked by its version.
          $setup2 = Get-ChildItem (Join-Path $env:RUNNER_TEMP '0.0.2') -Filter '*_0.0.2_*-setup.exe' | Select-Object -First 1
          Copy-Item $setup2.FullName (Join-Path $feed 'setup.exe')
          $sig = Get-Content -Raw "$($setup2.FullName).sig"
          @{ version = '0.0.2'; notes = 'trial'; pub_date = '2026-10-30T00:00:00Z'; platforms = @{ 'windows-x86_64' = @{ signature = $sig.Trim(); url = 'http://127.0.0.1:8765/setup.exe' } } } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $feed 'latest.json')
          Start-Process python -ArgumentList '-m', 'http.server', '8765', '--bind', '127.0.0.1', '--directory', $feed -WindowStyle Hidden
          for ($i = 0; $i -lt 20; $i++) { try { Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/latest.json | Out-Null; break } catch { Start-Sleep -Milliseconds 500 } }
          $setup1 = Get-ChildItem (Join-Path $env:RUNNER_TEMP '0.0.1') -Filter '*_0.0.1_*-setup.exe' | Select-Object -First 1
          (Start-Process -FilePath $setup1.FullName -ArgumentList '/S' -PassThru).WaitForExit()
          Start-Sleep -Seconds 3
          Get-Process | Where-Object { $_.Path -like "*Hyleon Trial T*" } | Stop-Process -ErrorAction SilentlyContinue
          # Where NSIS put it isn't certain, so look where a per-user or per-machine install would go.
          $exe = Get-ChildItem $env:LOCALAPPDATA, $env:ProgramFiles -Recurse -Depth 3 -Filter 'trial-tauri.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'The installed app was not found.' }
          "Installed at $($exe.FullName)"
          $marker = Join-Path $env:RUNNER_TEMP 'self-test.txt'
          $log = Join-Path $env:RUNNER_TEMP 't-update.log'
          Start-Process -FilePath $exe.FullName -ArgumentList '--self-test', $marker, '--update-feed', 'http://127.0.0.1:8765/latest.json', '--log', $log
          $deadline = (Get-Date).AddMinutes(4)
          while ((Get-Date) -lt $deadline -and -not ((Test-Path $marker) -and (Select-String -Path $marker -Pattern 'up to date' -Quiet))) { Start-Sleep -Seconds 2 }
          '--- app log'; if (Test-Path $log) { Get-Content $log } else { '(none)' }
          if (-not (Test-Path $marker)) { throw 'The app never wrote its self-test file.' }
          $lines = @(Get-Content $marker)
          $lines
          $expected = '^0\.0\.1 rendered in \d+ ms$', '^0\.0\.2 rendered in \d+ ms$', '^Hyleon 0\.0\.2 is up to date\.$'
          if ($lines.Count -ne 3) { throw "Expected 3 lines, got $($lines.Count)." }
          for ($i = 0; $i -lt 3; $i++) { if ($lines[$i] -notmatch $expected[$i]) { throw "Line $($i + 1) is wrong." } }
          'Installed 0.0.1, installed the signed 0.0.2 and relaunched.'
