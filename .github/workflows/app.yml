name: App builds

# Started by hand. Builds the app for the web, Windows and macOS, and proves a Velopack update
# installs and relaunches on Windows and macOS (T-02). Every push lints only the web build (ci.yml),
# so desktop-only code is checked here. Windows and macOS use GitHub's runners for this trial; their
# minutes come from the plan's included amount, which stops at its limit (D-039).
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which build to run, so a rerun spends only the minutes it needs
        type: choice
        options: [all, web, windows, macos]
        default: all

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The Dioxus CLI sends telemetry unless told not to (docs/ARCHITECTURE.md, Platform leaks).
  DX_TELEMETRY_ENABLED: "false"
  DX_RELEASE: https://github.com/DioxusLabs/dioxus/releases/download/v0.7.10
  VPK_VERSION: 1.2.161

jobs:
  web:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'web' }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install dx
        run: |
          curl -fsSL -o dx.tar.gz "$DX_RELEASE/dx-x86_64-unknown-linux-gnu.tar.gz"
          echo "4363e4ed2a3f1eb7f4d38d2d59aed59ce43271c44c16b425e92c89a64761fbe7  dx.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/dx" && tar -xzf dx.tar.gz -C "$RUNNER_TEMP/dx"
          dirname "$(find "$RUNNER_TEMP/dx" -name dx -type f)" >> "$GITHUB_PATH"

      - name: Build
        run: dx build --package hyleon-ui --platform web --release

      - name: Renders in a browser
        run: |
          public=$(dirname "$(find target/dx -path '*/web/public/index.html' | head -n 1)")
          python3 -m http.server 8080 --directory "$public" &
          sleep 2
          chrome=$(command -v google-chrome || command -v chromium)
          "$chrome" --headless=new --disable-gpu --virtual-time-budget=20000 --dump-dom http://127.0.0.1:8080/ > page.html
          for text in "Sheet E-101: drive bus and control wiring" "Findings (4)" "Pump P-101 and its drive"; do
            grep -qF "$text" page.html || { echo "missing: $text"; exit 1; }
          done
          echo "web build rendered"
          echo "PUBLIC=$public" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyleon-trial-web
          path: ${{ env.PUBLIC }}
          retention-days: 3

  windows:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'windows' }}
    runs-on: windows-2025
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install dx and vpk
        run: |
          curl -fsSL -o dx.zip "$DX_RELEASE/dx-x86_64-pc-windows-msvc.zip"
          echo "45eb4f87b7f86fdba8508ee7e0ef1f9e13cf8f2ffcc6a2d5858d0e8ea7dd1531  dx.zip" | sha256sum -c -
          unzip -q dx.zip -d "$RUNNER_TEMP/dx"
          dirname "$(find "$RUNNER_TEMP/dx" -name dx.exe -type f)" >> "$GITHUB_PATH"
          dotnet tool install -g vpk --version "$VPK_VERSION"

      - name: Desktop lints
        run: cargo clippy -p hyleon-ui --features desktop --locked -- -D warnings

      - name: Build
        run: dx build --package hyleon-ui --platform desktop --release

      # The same build is packed twice, as 0.0.1 and 0.0.2, so 0.0.1 has a newer version to find.
      - name: Package
        run: |
          app=$(dirname "$(find target/dx -path '*/release/windows/app/hyleon-ui.exe' | head -n 1)")
          ls "$app"
          vpk pack --packId HyleonTrial --packTitle Hyleon --packVersion 0.0.1 --packDir "$app" --mainExe hyleon-ui.exe --outputDir releases
          mv releases/HyleonTrial-win-Setup.exe setup-0.0.1.exe
          vpk pack --packId HyleonTrial --packTitle Hyleon --packVersion 0.0.2 --packDir "$app" --mainExe hyleon-ui.exe --outputDir releases
          ls releases

      - name: Install 0.0.1, update to 0.0.2, relaunch
        shell: pwsh
        run: |
          # Wait for the installer only: it may start the app, which would never exit by itself.
          (Start-Process -FilePath .\setup-0.0.1.exe -ArgumentList '--silent' -PassThru).WaitForExit()
          Start-Sleep -Seconds 3
          Stop-Process -Name hyleon-ui -ErrorAction SilentlyContinue
          $marker = Join-Path $env:RUNNER_TEMP 'self-test.txt'
          $feed = (Resolve-Path releases).Path
          $exe = Join-Path $env:LOCALAPPDATA 'HyleonTrial\current\hyleon-ui.exe'
          Start-Process -FilePath $exe -ArgumentList '--update-feed', $feed, '--self-test', $marker
          $deadline = (Get-Date).AddMinutes(3)
          while ((Get-Date) -lt $deadline -and -not ((Test-Path $marker) -and (Select-String -Path $marker -Pattern 'up to date' -Quiet))) {
            Start-Sleep -Seconds 2
          }
          if (-not (Test-Path $marker)) { throw 'The app never wrote its self-test file.' }
          $lines = @(Get-Content $marker)
          $lines
          $expected = '^0\.0\.1 rendered in \d+ ms$', '^0\.0\.2 rendered in \d+ ms$', '^Hyleon 0\.0\.2 is up to date\.$'
          if ($lines.Count -ne 3) { throw "Expected 3 lines, got $($lines.Count)." }
          for ($i = 0; $i -lt 3; $i++) { if ($lines[$i] -notmatch $expected[$i]) { throw "Line $($i + 1) is wrong." } }
          'Installed 0.0.1, updated to 0.0.2 and relaunched.'

  macos:
    if: ${{ inputs.platform == 'all' || inputs.platform == 'macos' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install dx and vpk
        run: |
          curl -fsSL -o dx.tar.gz "$DX_RELEASE/dx-aarch64-apple-darwin.tar.gz"
          echo "342c92bc33dca60dadd725ed5e249923f049ae2e1e50b7477f4968d56695b425  dx.tar.gz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/dx" && tar -xzf dx.tar.gz -C "$RUNNER_TEMP/dx"
          dirname "$(find "$RUNNER_TEMP/dx" -name dx -type f)" >> "$GITHUB_PATH"
          dotnet tool install -g vpk --version "$VPK_VERSION"
          # On this image .NET isn't in its default folder, so vpk is told where it is.
          echo "DOTNET_ROOT=$(dirname "$(realpath "$(command -v dotnet)")")" >> "$GITHUB_ENV"

      - name: Desktop lints
        run: cargo clippy -p hyleon-ui --features desktop --locked -- -D warnings

      - name: Build
        run: dx build --package hyleon-ui --platform desktop --release

      - name: Package
        run: |
          app=$(find target/dx -maxdepth 5 -type d -path '*/release/macos/*.app' | head -n 1)
          ls "$app/Contents/MacOS"
          vpk pack --packId HyleonTrial --packTitle Hyleon --packVersion 0.0.1 --packDir "$app" --mainExe hyleon-ui --outputDir releases
          mkdir -p trial && mv releases/HyleonTrial-osx-Portable.zip trial/hyleon-0.0.1.zip
          vpk pack --packId HyleonTrial --packTitle Hyleon --packVersion 0.0.2 --packDir "$app" --mainExe hyleon-ui --outputDir releases
          ls releases

      - name: Run 0.0.1, update to 0.0.2, relaunch
        run: |
          ditto -x -k trial/hyleon-0.0.1.zip "$RUNNER_TEMP/try"
          app=$(find "$RUNNER_TEMP/try" -maxdepth 1 -name '*.app' | head -n 1)
          marker="$RUNNER_TEMP/self-test.txt"
          "$app/Contents/MacOS/hyleon-ui" --update-feed "$PWD/releases" --self-test "$marker" &
          for _ in $(seq 90); do
            grep -q 'up to date' "$marker" 2>/dev/null && break
            sleep 2
          done
          cat "$marker"
          sed -n 1p "$marker" | grep -Eq '^0\.0\.1 rendered in [0-9]+ ms$'
          sed -n 2p "$marker" | grep -Eq '^0\.0\.2 rendered in [0-9]+ ms$'
          sed -n 3p "$marker" | grep -Eq '^Hyleon 0\.0\.2 is up to date\.$'
          test "$(wc -l < "$marker")" -eq 3
          echo "Ran 0.0.1, updated to 0.0.2 and relaunched."

      # For Dan's check on his Mac: 0.0.1 and the feed it updates from.
      - run: mv releases trial/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hyleon-trial-macos
          path: trial
          retention-days: 3
