# The core does no I/O (docs/ARCHITECTURE.md, Layering): files, the network, processes and
# the clock reach it through ports. Clippy reads this file for every crate under crates/core/,
# and CI denies its warnings.

disallowed-types = [
    { path = "std::fs::File", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::OpenOptions", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::net::TcpStream", reason = "the core does no I/O; no network (docs/ARCHITECTURE.md)" },
    { path = "std::net::TcpListener", reason = "the core does no I/O; no network (docs/ARCHITECTURE.md)" },
    { path = "std::net::UdpSocket", reason = "the core does no I/O; no network (docs/ARCHITECTURE.md)" },
    { path = "std::process::Command", reason = "the core does no I/O; no processes (docs/ARCHITECTURE.md)" },
]

disallowed-methods = [
    { path = "std::fs::read", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::read_to_string", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::write", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::read_dir", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::create_dir", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::create_dir_all", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::remove_file", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::remove_dir", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::remove_dir_all", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::copy", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::rename", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::metadata", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::symlink_metadata", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::canonicalize", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::hard_link", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::read_link", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::set_permissions", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::fs::exists", reason = "the core does no I/O; files come through a port (docs/ARCHITECTURE.md)" },
    { path = "std::time::SystemTime::now", reason = "time comes through a port (docs/ARCHITECTURE.md)" },
    { path = "std::time::Instant::now", reason = "time comes through a port (docs/ARCHITECTURE.md)" },
]
