[workspace]
resolver = "3"
members = [
    "crates/core/*",
    "crates/adapters/*",
    "crates/binaries/*",
    "crates/guardrails",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

# Exact pins, each version published at least two weeks before it's added (CLAUDE.md, Dependencies).
[workspace.dependencies]
cargo_metadata = "=0.23.1"
